[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foldabs-repro"
version = "0.1.0"
description = "Small-scale, reproducible FoldAbS developability experiments."
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.26,<3",
  "pandas>=2.1",
  "PyYAML>=6.0",
  "scikit-learn>=1.4",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

